<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Masuk - Sentra Mina & Tani</title>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- CSS Utama Portal -->
    <link rel="stylesheet" href="CSS/door.css" />
  </head>

  <body>
    <!-- Overlay Transisi Loading -->
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <p class="loading-text">Memuat Halaman Form...</p>
    </div>

    <div class="portal-container" id="portalContainer">
      <!-- Judul yang dianimasikan via JS -->
      <h2 class="h2-content" id="animatedTitle">Sentra Mina Argo Mekarmukti</h2>

      <p class="sub-content">
        Website Ini Masih dalam Pengembangan, Harap dimaklumi😅
      </p>

      <!-- Indikator Petunjuk Klik -->
      <div class="click-indicator">
        <span>Klik logo di bawah untuk masuk</span>
        <span>👇</span>
      </div>

      <!-- Wrapper Logo Interaktif -->
      <div class="logo-door-wrapper" id="logoWrapper">
        <!-- Layer Khusus Daun -->
        <div class="logo-part logo-daun">
          <img src="Assets/Logo.png" alt="Elemen Daun" />
        </div>
        <!-- Layer Khusus Ikan -->
        <div class="logo-part logo-ikan">
          <img src="Assets/Logo.png" alt="Elemen Ikan" />
        </div>
      </div>
    </div>

    <!-- Footer Minimalis -->
    <footer class="portal-footer">
      <span>Sentra Mina Argo Mekarmukti &copy; 2026</span>
    </footer>

    <!-- Script Utama Portal -->
    <script src="JS/door.js"></script>
  </body>
</html>

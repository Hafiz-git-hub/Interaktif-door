<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Masuk - Sentra Mina & Tani</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/door.css">
</head>
<body>

    <div class="portal-container" id="portalContainer">
        <h2 class="h2-content">Klik Logo untuk Masuk</h2>
        <p class="sub-content">Sentra Mina & Tani Mekarmukti</p>
        
        <!-- Wrapper Logo Interaktif -->
        <div class="logo-door-wrapper" id="logoWrapper">
            <!-- Layer Khusus Daun -->
            <div class="logo-part logo-daun">
                <img src="Assets/Logo.png" alt="Elemen Daun">
            </div>
            <!-- Layer Khusus Ikan -->
            <div class="logo-part logo-ikan">
                <img src="Assets/Logo.png" alt="Elemen Ikan">
            </div>
        </div>
    </div>

    <script src="JS/door.js"></script>
</body>
</html>
